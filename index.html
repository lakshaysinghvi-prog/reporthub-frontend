<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReportHub</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3d1a08" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ReportHub" />
    <link rel="apple-touch-icon" href="/Icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/Icons/icon-192.png" />
    <meta name="description" content="ReportHub — your reports, anywhere" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Unregister any stale service workers and clear caches on every load -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(r) { r.unregister(); });
        });
        caches.keys().then(function(names) {
          names.forEach(function(name) { caches.delete(name); });
        });
      }
    </script>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
